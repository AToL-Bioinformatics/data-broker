[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "broker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "lxml>=5.2.0",
    "tenacity>=8.3.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[project.scripts]
broker = "broker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/broker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = ["e2e: end-to-end tests against real ENA/Canopy (skipped by default)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
